<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Payment Gateway</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eef2f7;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:460px;
background:#ffffff;
padding:30px;
border-radius:18px;
box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.logo{
font-size:42px;
text-align:center;
margin-bottom:10px;
}

h2{
text-align:center;
color:#0057d9;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
font-size:14px;
}

.row{
display:flex;
gap:12px;
}

.row div{
flex:1;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold;
}

input,
select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
font-size:15px;
}

button{
width:100%;
padding:15px;
margin-top:25px;
background:#0057d9;
color:#fff;
border:none;
border-radius:10px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0048b3;
}

</style>

</head>

<body>
<div class="container">

    <div class="logo">💳</div>

    <h2>Secure Payment Gateway</h2>

    <p class="subtitle">
        Fast • Secure • PCI DSS Protected
    </p>

    <form action="/pay" method="POST">

        <label>Cardholder Name</label>
        <input
            type="text"
            name="cardholder"
            placeholder="David Johnson"
            required
        >

        <label>Card Number</label>
        <input
            id="cardNumber"
            type="text"
            name="cardNumber"
            placeholder="4111 1111 1111 1111"
            maxlength="19"
            required
        >

        <small id="cardType"
        style="display:block;margin-top:6px;color:#0057d9;font-weight:bold;">
        </small>

        <div class="row">

            <div>

                <label>Expiry</label>

                <input
                    type="text"
                    id="expiry"
                    name="expiry"
                    placeholder="MM/YY"
                    maxlength="5"
                    required
                >

            </div>

            <div>

                <label>CVV</label>

                <input
                    type="password"
                    name="cvv"
                    placeholder="123"
                    maxlength="4"
                    required
                >

            </div>

        </div>

        <label>Amount ($)</label>

        <input
            type="number"
            name="amount"
            placeholder="100"
            required
        >

        <label>MCC</label>

        <select name="mcc">

            <option>Office Supply</option>
            <option>Electronics</option>
            <option>Travel</option>
            <option>Retail</option>
            <option>Digital Services</option>

        </select>

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="customer@email.com"
            required
        >

        <button id="payBtn" type="submit">
            🔒 Pay Securely
        </button>

    </form>

</div>
<script>
<script>

// Card Number Formatting + Card Type

const cardInput = document.getElementById("cardNumber");
const cardType = document.getElementById("cardType");

cardInput.addEventListener("input", function(){

let value = this.value.replace(/\D/g,"");

if(value.startsWith("4")){

cardType.innerHTML="💳 VISA";

}
else if(value.startsWith("5")){

cardType.innerHTML="💳 Mastercard";

}
else if(value.startsWith("34") || value.startsWith("37")){

cardType.innerHTML="💳 American Express";

}
else{

cardType.innerHTML="";

}

value=value.substring(0,19);

value = value.replace(/(\d{4})(?=\d)/g, "$1 ");
this.value=value;

});

// Expiry Formatting

const expiry=document.getElementById("expiry");

expiry.addEventListener("input",function(){

let value=this.value.replace(/\D/g,"");

if(value.length>2){

value=value.substring(0,2)+"/"+value.substring(2,4);

}

this.value=value;

});

// Loading Button

document.querySelector("form").addEventListener("submit",function(){

const btn=document.getElementById("payBtn");

btn.disabled=true;

btn.innerHTML="⏳ Processing Payment...";

});

</script>
</script>
</body>

</html>
